# Whiteboard, built from source:
#
#   cp .env.example .env      # configure sign-in, see SELF_HOSTING.md
#   docker compose up -d --build
#
# The app then runs on http://127.0.0.1:8080. Put a reverse proxy with
# HTTPS in front of it (Cloudflare Tunnel, Caddy, Traefik, nginx, ...).

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      # Default: reachable from this machine only, the proxy sits in front.
      # WHITEBOARD_BIND=0.0.0.0 only with AUTH_MODE=single on your own network.
      - "${WHITEBOARD_BIND:-127.0.0.1}:${WHITEBOARD_PORT:-8080}:80"
    depends_on:
      - api

  api:
    build: ./server
    restart: unless-stopped
    # No ports: the API is only reachable through the web container.
    env_file: .env
    volumes:
      # SQLite database and uploaded images. Back this up.
      - ./data:/data
