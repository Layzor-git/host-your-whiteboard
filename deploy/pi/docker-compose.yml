# Fuer ./deploy.sh: Web-App und API-Image kommen fertig vom PC,
# auf dem Server wird nichts gebaut. Liegt dort in ~/apps/<DEPLOY_NAME>/.

services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Nur lokal erreichbar. Niemals "8083:80" schreiben: Dann haengt
      # die App am offenen Netz vorbei an Cloudflare Access.
      - "127.0.0.1:8083:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
    depends_on:
      - api

  api:
    image: whiteboard-api:latest   # = <DEPLOY_NAME>-api from deploy.env
    restart: unless-stopped
    # Kein ports: Der Container ist nur im Docker-Netz erreichbar.
    env_file: .env
    volumes:
      # SQLite und Uploads. Dieses Verzeichnis gehoert ins Backup.
      - ./data:/data
