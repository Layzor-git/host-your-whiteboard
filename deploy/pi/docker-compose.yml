# For ./deploy.sh: web app and API image arrive ready-built from the PC,
# nothing is built on the server. Lives there in ~/apps/<DEPLOY_NAME>/.

services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Local access only. Never write "8083:80": that puts the app on the
      # open network, bypassing Cloudflare Access.
      - "127.0.0.1:8083:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
    depends_on:
      - api

  api:
    image: whiteboard-api:latest   # = <DEPLOY_NAME>-api from deploy.env
    restart: unless-stopped
    # No ports: the container is only reachable inside the Docker network.
    env_file: .env
    volumes:
      # SQLite and uploads. Include this directory in your backups.
      - ./data:/data
